# Edge-NET MQTT broker — managed in the edge-net-hub repo.
# Self-contained, trusted WiFi network: anonymous access, no TLS.
# Access is restricted at the network layer by pf, not by the broker.

log_dest syslog

# WiFi side — every node reaches the broker here.
# pf only passes 1883 to 10.1.1.1, so binding this address is the front door.
listener 1883 10.1.1.1

# Loopback — hub-side tooling (bridges, scripts) can talk to the broker locally.
listener 1883 127.0.0.1

allow_anonymous true
