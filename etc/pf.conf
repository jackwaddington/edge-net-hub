# Edge-NET pf firewall rules
# Hub: Raspberry Pi 4 · OpenBSD

ext_if  = "bse0"   # ethernet uplink to home network (optional)
wifi_if = "bwfm0"  # WiFi AP — nodes connect here

wifi_net    = "10.1.1.0/24"
linux_nodes = "{ 10.1.1.10, 10.1.1.11 }"
mcu_nodes   = "{ 10.1.1.20, 10.1.1.21 }"

set skip on lo

block all

# SSH and ping from home network
pass in on $ext_if proto tcp to $ext_if port 22 keep state
pass in on $ext_if proto icmp keep state

# MQTT broker — all nodes
pass in on $wifi_if proto tcp to $wifi_if port 1883 keep state

# Linux nodes can reach each other (SSH etc.)
pass in on $wifi_if from $linux_nodes to $wifi_net keep state

# NAT — traffic out to home network / internet when ethernet uplink is present
match out on $ext_if from $wifi_net nat-to ($ext_if)
pass in on $wifi_if from $wifi_net to any keep state
pass out on $ext_if keep state
pass out on $wifi_if keep state

# GFX → Grafana/Prometheus on k3s master
pass in on $wifi_if proto tcp from 10.1.1.20 to 192.168.0.216 port { 3000, 9090 } keep state
